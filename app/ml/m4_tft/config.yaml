data:
  tickers: ["AAPL", "MSFT", "^IXIC", "^VIX"]
  start_date: "2015-01-01"
  end_date: "2025-01-01"
  window_size: 60
  horizon: 30
  vol_window: 20        # 실현변동성(σ) Rolling Window

model:
  quantiles: [0.05,0.10,0.15,0.20,0.25,0.30,
             0.35,0.40,0.45,0.50,0.55,
             0.60,0.65,0.70,0.75,0.80,
             0.85,0.90,0.95]
  vix_threshold: 25     # λt 선형 증가 시작 임계값 (raw VIX 기준)
  # m4.ckpt 실측 shape 기준 (hidden_size 64→32, attn 4→2):
  #   multihead_attn.v_layer (16,32) → hidden_size=32, attention_head_size=2
  #   static flattened_grn.fc1 (5,113) → vol_group static categorical 포함
  hidden_size: 32
  attention_head_size: 2
  hidden_continuous_size: 32
  dropout: 0.1
  learning_rate: 0.0003
  max_epochs: 50
  batch_size: 64
