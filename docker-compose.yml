services:
  db:
    image: postgres:16-alpine
    container_name: before-db
    environment:
      # 운영 진입 시 .env 또는 secret manager 에서 주입. 미설정이면 compose 부팅 자체 실패.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: before-api
    # 운영용 — Dockerfile 의 ENTRYPOINT(scripts/entrypoint.sh) 가 그대로 실행.
    # docker-compose.override.yml 이 dev 편의(--reload, port expose) 를 자동 머지.
    environment:
      ENV: ${ENV:?ENV must be set (dev|prod|test)}
      # Postgres 호스트는 같은 compose 네트워크의 'db' 서비스. 외부 DB 면 운영에서 override.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${PORT:-8000}
      # 시크릿 — 미설정이면 부팅 자체 실패. dev 라도 .env 에서 의도적으로 채워야 함.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-3600}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-1209600}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      FRED_API_KEY: ${FRED_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
